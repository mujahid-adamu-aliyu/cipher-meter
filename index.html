<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111827;
      color: #fff;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚧 Under Maintenance</h1>
    <p>We're currently performing scheduled maintenance.</p>
    <p>Please check back soon.</p>
  </div>
</body>
</html>
